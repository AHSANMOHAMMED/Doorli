# Doorli nginx reverse proxy — copy to /etc/nginx/conf.d/doorli.conf
upstream doorli_api { server 127.0.0.1:3001; }
upstream doorli_customer { server 127.0.0.1:3000; }
upstream doorli_vendor { server 127.0.0.1:3002; }
upstream doorli_admin { server 127.0.0.1:3005; }
upstream doorli_super_admin { server 127.0.0.1:3006; }
upstream doorli_erp { server 127.0.0.1:3010; }

# Retail Smart ERP.
#
# The ERP is a standalone Next.js product: it emits root-relative URLs
# ("/login", "/_next/...", "/manifest.webmanifest") and makes ~1200 absolute
# fetch("/api/...") calls. Mounting it under doorli.me/erp/ made all of those
# resolve against the marketplace instead of the ERP, so it loaded with no CSS
# and its links landed on customer-web. It therefore needs its own hostname.
server {
    listen 80;
    listen [::]:80;
    # erp.140.245.207.93.nip.io is a wildcard-DNS alias that resolves to this
    # host with no DNS setup; it keeps the ERP reachable before/if the
    # erp.doorli.me A record is missing.
    server_name erp.doorli.me erp.140.245.207.93.nip.io;

    client_max_body_size 25m;

    location / {
        proxy_pass http://doorli_erp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name doorli.me 140.245.207.93;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://doorli_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /health {
        proxy_pass http://doorli_api/health;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://doorli_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Pass full URI so Next basePath (/vendor, /admin) does not slash-loop
    location /admin {
        proxy_pass http://doorli_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /super-admin {
        proxy_pass http://doorli_super_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /vendor {
        proxy_pass http://doorli_vendor;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy sub-path entrypoint. Kept proxying so /erp stays reachable until
    # the erp.doorli.me A record exists; swap to the redirect below once it does.
    # Note: served this way the ERP has no CSS and its links escape to
    # customer-web, because it emits root-relative URLs.
    #   rewrite ^/erp/?(.*)$ http://erp.doorli.me/$1 permanent;
    location /erp/ {
        proxy_pass http://doorli_erp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /erp {
        return 302 /erp/;
    }

    location / {
        proxy_pass http://doorli_customer;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
