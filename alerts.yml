groups:
  - name: doorli-api
    rules:
      - alert: APIHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Doorli API error rate > 5%"
          description: "Service {{ $labels.job }} has {{ $value | humanizePercentage }} error rate"

      - alert: APIHighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency > 200ms"
          description: "Service {{ $labels.job }} p95 latency is {{ $value | humanizeDuration }}"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Doorli service is down"
          description: "{{ $labels.job }} has been down for more than 1 minute"

  - name: doorli-postgres
    rules:
      - alert: PostgreSQLHighConnections
        expr: pg_stat_activity_count > 400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count > 400"

      - alert: PostgreSQLReplicationLag
        expr: pg_replication_lag > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL replication lag > 30s"

  - name: doorli-redis
    rules:
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 85%"

  - name: doorli-business
    rules:
      - alert: OrderDispatchQueueBacklog
        expr: bullmq_queue_waiting_jobs{queue="dispatch"} > 100
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Dispatch queue has > 100 waiting jobs"
          description: "Possible driver shortage or service degradation"

      - alert: ERPSyncFailureSpike
        expr: rate(erp_sync_failures_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ERP sync failure rate elevated"
