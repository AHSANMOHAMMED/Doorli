name: Doorli CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: doorli-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: doorli
          POSTGRES_PASSWORD: doorli_secret
          POSTGRES_DB: doorli
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doorli -d doorli"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://doorli:doorli_secret@localhost:5432/doorli?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ERP_INTERNAL_SECRET: ci-erp-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
      - run: npm run generate --workspace=@doorli/db
      - run: npm run build --workspace=@doorli/api
      - run: npm run build --workspace=@doorli/customer-web
      - run: npm run lint --workspace=@doorli/api
      - run: npm run lint --workspace=@doorli/customer-web
      - run: npm run test --workspace=@doorli/api
