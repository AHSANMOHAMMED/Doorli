name: Doorli CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Verify lockfile exists
        run: test -f package-lock.json || (echo "package-lock.json is required for npm ci" && exit 1)

      - name: Validate lockfile
        run: node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('package-lock.json','utf8')); console.log('package-lock.json is valid JSON')"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        
      - name: Lint
        run: npm run lint --if-present
        
      - name: Test
        run: npm test --if-present
