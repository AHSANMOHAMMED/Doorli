name: Doorli CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_STRICT: 0
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify lockfile exists
        run: test -f package-lock.json || (echo "package-lock.json is required for npm ci" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Verify npm package manager
        run: |
          test "$(node -p "require('./package.json').packageManager")" = "npm@11.14.1"
          corepack disable || true
          npm --version

      - name: Validate lockfile JSON
        run: node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('package-lock.json','utf8')); console.log('package-lock.json is valid JSON')"

      - name: Validate workspace versions are semver
        run: |
          node -e "
          const fs=require('fs');
          const path=require('path');
          const semver=/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
          const roots=['apps','services','packages'];
          for (const r of roots){
            if(!fs.existsSync(r)) continue;
            for (const d of fs.readdirSync(r)){
              const pj=path.join(r,d,'package.json');
              if(!fs.existsSync(pj)) continue;
              const j=JSON.parse(fs.readFileSync(pj,'utf8'));
              if(!j.version || !semver.test(j.version)){
                console.error('Invalid version in ' + pj + ': ' + j.version);
                process.exit(1);
              }
            }
          }
          console.log('All workspace versions are valid semver');
          "

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=optional --no-audit --no-fund

      # Embedded Retail Smart ERP has a latent Next 15 monorepo dual-React prerender
      # failure (/404 useContext). Marketplace packages still build; ERP tracked separately.
      - name: Build
        run: ./node_modules/.bin/turbo run build --filter='!@doorli/erp' --filter='!@doorli/mobile'
        
      - name: Lint
        run: ./node_modules/.bin/turbo run lint
        
      - name: Test
        run: ./node_modules/.bin/turbo run test
