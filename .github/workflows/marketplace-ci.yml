name: Marketplace CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@doorli/db
      - run: npm run build --workspace=@doorli/types
      - run: npm run build --workspace=@doorli/utils
      - run: npm run build --workspace=@doorli/api
      - run: npm test --workspace=@doorli/api
      - run: npm run build --workspace=@doorli/customer-web
      - run: npm run build --workspace=@doorli/vendor-web
      - run: npm run build --workspace=@doorli/admin
      - run: npm run build --workspace=@doorli/super-admin
      - run: npm run build --workspace=@doorli/erp
      - run: ./scripts/security-audit.sh
      - run: git diff --check
