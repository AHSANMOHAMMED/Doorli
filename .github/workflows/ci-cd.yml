name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build all packages
        run: npx turbo run build --filter='!@doorli/erp' --filter='!@doorli/mobile'

      - name: Lint
        run: npx turbo run lint

      - name: Test
        run: npx turbo run test

  build-mobile:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Check for EXPO_TOKEN
        id: check-token
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN not set — skipping mobile builds"
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Setup EAS
        if: steps.check-token.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (Preview)
        if: steps.check-token.outputs.has_token == 'true' && github.ref == 'refs/heads/develop'
        run: eas build --platform android --profile preview --non-interactive
        working-directory: apps/mobile

      - name: Build iOS (Preview)
        if: steps.check-token.outputs.has_token == 'true' && github.ref == 'refs/heads/develop'
        run: eas build --platform ios --profile preview --non-interactive
        working-directory: apps/mobile

      - name: Build Android (Production)
        if: steps.check-token.outputs.has_token == 'true' && github.ref == 'refs/heads/main'
        run: eas build --platform android --profile production --non-interactive
        working-directory: apps/mobile

      - name: Build iOS (Production)
        if: steps.check-token.outputs.has_token == 'true' && github.ref == 'refs/heads/main'
        run: eas build --platform ios --profile production --non-interactive
        working-directory: apps/mobile

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build all packages
        run: npx turbo run build --filter='!@doorli/erp' --filter='!@doorli/mobile'

      - name: Check deployment secrets
        id: check-secrets
        run: |
          if [ -n "$OCI_HOST" ] && [ -n "$OCI_SSH_KEY" ]; then
            echo "has_oci=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_oci=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OCI secrets not configured — skipping OCI deploy"
          fi
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "has_vercel=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vercel=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN not configured — skipping Vercel deploy"
          fi
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to OCI
        if: steps.check-secrets.outputs.has_oci == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd /opt/doorli
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy
            docker system prune -f

      - name: Deploy Web Apps (Vercel)
        if: steps.check-secrets.outputs.has_vercel == 'true'
        run: |
          npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG }} apps/customer-web
          npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG }} apps/vendor-web
          npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG }} apps/admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG: ${{ secrets.VERCEL_ORG }}
