events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=doorli_api:10m rate=30r/s;
    server_tokens off;

    upstream api { server api:3001; }
    upstream auth { server auth:4001; }
    upstream delivery { server delivery:8086; }
    upstream notifications { server notifications:4007; }
    upstream customer-web { server customer-web:3000; }
    upstream admin { server admin:3000; }

    server {
        listen 80;
        client_max_body_size 10m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

        location /api {
            limit_req zone=doorli_api burst=60 nodelay;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://api;
        }
        location /auth { proxy_pass http://auth; }
        location /delivery { proxy_pass http://delivery; }
        location /notifications { proxy_pass http://notifications; }
        location /admin { proxy_pass http://admin; }
        location / { proxy_pass http://customer-web; }
    }
}
