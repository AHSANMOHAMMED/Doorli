global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:3001']
    metrics_path: /metrics

  - job_name: 'auth'
    static_configs:
      - targets: ['auth:4001']
    metrics_path: /metrics

  - job_name: 'delivery'
    static_configs:
      - targets: ['delivery:8086']
    metrics_path: /metrics
