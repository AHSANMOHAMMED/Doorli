services:
  # DEPRECATED — live Super Admin is apps/admin at /admin (port 3005 via nginx).
  # Opt-in only: docker compose --profile deprecated up super-admin
  super-admin:
    profiles: ["deprecated"]
    build:
      context: .
      dockerfile: apps/super-admin/Dockerfile
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPER_ADMIN_URL=http://doorli.me/admin
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://user:pass@db:5432/doorli?schema=public
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=doorli
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
