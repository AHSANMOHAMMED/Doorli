version: "3.8"

services:
  super-admin:
    build:
      context: .
      dockerfile: apps/super-admin/Dockerfile
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://user:pass@db:5432/doorli?schema=public

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=doorli
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
